<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KH Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #050508;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      color: #fff;
    }

    /* ノイズオーバーレイ */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.4;
      pointer-events: none;
      z-index: 1;
    }

    canvas#stars-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    .stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .ambient {
      position: absolute;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(0,229,255,0.07) 0%, transparent 65%);
      border-radius: 50%;
      animation: pulse-ambient 4s ease-in-out infinite;
      pointer-events: none;
    }

    .logo-wrap {
      position: relative;
      width: 220px;
      height: 220px;
      opacity: 0;
      animation: fade-in 1s ease 0.4s forwards;
    }

    .logo-wrap svg { width: 100%; height: 100%; }

    .wordmark {
      margin-top: 36px;
      opacity: 0;
      animation: fade-up 0.9s ease 0.9s forwards;
    }

    .wordmark .name {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: 0.22em;
      color: #fff;
    }

    .wordmark .name span { color: #00e5ff; }

    .wordmark .rule {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #00e5ff, transparent);
      margin: 14px 0;
    }

    .wordmark .sub {
      font-family: 'Orbitron', sans-serif;
      font-weight: 400;
      font-size: clamp(8px, 1.2vw, 11px);
      letter-spacing: 0.55em;
      color: #00e5ff;
      text-transform: uppercase;
    }

    .loader-wrap {
      position: fixed;
      bottom: 60px;
      width: 180px;
      opacity: 0;
      animation: fade-in 0.8s ease 1.4s forwards;
    }

    .loader-track {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .loader-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #00e5ff, #80f4ff);
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(0,229,255,0.6);
      animation: load 5s linear 0.5s forwards;
    }

    .ver {
      position: fixed;
      bottom: 36px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 0.3em;
      color: rgba(255,255,255,0.18);
      text-transform: uppercase;
      opacity: 0;
      animation: fade-in 1s ease 1.6s forwards;
    }

    @keyframes pulse-ambient {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.1); opacity: 0.6; }
    }
    @keyframes load {
      0%   { width: 0; }
      60%  { width: 75%; }
      100% { width: 100%; }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <canvas id="stars-canvas"></canvas>

  <div class="stage">
    <div class="ambient"></div>

    <div class="logo-wrap">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="90" stroke="rgba(0,229,255,0.15)" stroke-width="1"/>
        <circle cx="100" cy="100" r="70" stroke="rgba(0,229,255,0.25)" stroke-width="1.5"/>
        <circle cx="100" cy="100" r="50" stroke="#00e5ff" stroke-width="1" opacity="0.4"/>
        <ellipse cx="100" cy="100" rx="90" ry="28" stroke="#00e5ff" stroke-width="1.5" opacity="0.6"/>
        <ellipse cx="100" cy="100" rx="70" ry="20" stroke="rgba(0,229,255,0.3)" stroke-width="1" transform="rotate(30 100 100)"/>
        <text x="100" y="107" text-anchor="middle" font-family="Orbitron,sans-serif" font-weight="900" font-size="36" fill="#fff" letter-spacing="4">KH</text>
      </svg>
    </div>

    <div class="wordmark">
      <div class="name">KH <span>Studio</span></div>
      <div class="rule"></div>
      <div class="sub">AI &amp; App Engineering</div>
    </div>
  </div>

  <div class="loader-wrap">
    <div class="loader-track"><div class="loader-fill"></div></div>
  </div>

  <div class="ver">v1.0.0 · kouno hiroaki</div>

  <script>
    // ── 星空アニメーション ──────────────────────────────
    (function () {
      var canvas = document.getElementById('stars-canvas');
      var ctx = canvas.getContext('2d');

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      var STAR_COUNT = 160;
      var stars = [];
      for (var i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x:     Math.random(),
          y:     Math.random(),
          r:     Math.random() * 1.2 + 0.2,
          o:     Math.random() * 0.5 + 0.1,
          speed: Math.random() * 0.0003 + 0.0001,
          phase: Math.random() * Math.PI * 2
        });
      }

      var t = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        t += 0.016;
        stars.forEach(function (s) {
          var opacity = s.o * (0.6 + 0.4 * Math.sin(t * s.speed * 100 + s.phase));
          ctx.beginPath();
          ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,' + opacity + ')';
          ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();

    // ── 5秒後にログイン画面へ遷移 ──────────────────────
    setTimeout(function () {
      window.location.href = 'index.html';
    }, 5000);
  </script>
</body>
</html>
